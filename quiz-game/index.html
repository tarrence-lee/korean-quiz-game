<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>상식퀴즈 게임</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="상식퀴즈" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- 시작 화면 -->
    <div id="screen-start" class="screen" tabindex="-1">
      <div class="card">
        <h1 class="title"><span aria-hidden="true">🧠</span> 상식퀴즈</h1>
        <p class="subtitle" id="subtitle-text">카테고리별 10문제씩, 최대 40문제에 도전하세요!</p>
        <div class="form-group">
          <label for="nickname-input">닉네임</label>
          <input
            id="nickname-input"
            type="text"
            placeholder="닉네임을 입력하세요 (2자 이상)"
            maxlength="12"
            autocomplete="nickname"
            aria-describedby="nickname-error"
            aria-invalid="false"
            aria-required="true"
          />
          <span id="nickname-error" class="error-msg hidden" role="alert">닉네임은 2자 이상 입력해 주세요.</span>
        </div>
        <div class="form-group">
          <p class="form-group-label">카테고리</p>
          <div class="category-display" aria-label="포함 카테고리 목록">
            <span class="cat-tag"><span aria-hidden="true">🏯</span> 한국사</span>
            <span class="cat-tag"><span aria-hidden="true">🔬</span> 과학</span>
            <span class="cat-tag"><span aria-hidden="true">🌏</span> 지리</span>
            <span class="cat-tag"><span aria-hidden="true">💡</span> 일반상식</span>
            <span class="cat-tag"><span aria-hidden="true">🧩</span> 인지능력</span>
          </div>
        </div>
        <div class="form-group" id="count-group">
          <label class="form-group-label" id="count-label">카테고리별 문제 수</label>
          <div class="count-control" role="group" aria-labelledby="count-label">
            <button type="button" class="count-btn" id="count-down" aria-label="문제 수 줄이기">−</button>
            <input
              id="count-input"
              type="number"
              min="1"
              max="100"
              value="3"
              aria-describedby="count-hint"
              aria-label="카테고리별 문제 수"
            />
            <button type="button" class="count-btn" id="count-up" aria-label="문제 수 늘리기">＋</button>
          </div>
          <span id="count-hint" class="count-hint">1~100문제 설정 가능 · 전체혼합 선택 시 카테고리별 적용</span>
          <span id="count-error" class="error-msg hidden" role="alert">1~100 사이의 숫자를 입력해 주세요.</span>
        </div>
        <button id="start-btn" class="btn btn-primary">게임 시작</button>
      </div>
    </div>

    <!-- 문제 화면 -->
    <div id="screen-quiz" class="screen hidden" tabindex="-1">
      <div class="card">
        <div class="quiz-header">
          <span id="quiz-category" class="badge" aria-label="현재 카테고리"></span>
          <span
            id="quiz-progress"
            class="progress-text"
            aria-live="polite"
            aria-atomic="true"
            aria-label="문제 진행 현황"
          ></span>
        </div>
        <div
          class="progress-bar-wrap"
          role="progressbar"
          aria-valuemin="0"
          aria-label="퀴즈 진행률"
        >
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="timer-wrap" aria-label="남은 시간">
          <div id="timer-ring" style="--pct:100%;--clr:#22c55e">
            <span id="timer-num" aria-live="polite" aria-atomic="true">10</span>
          </div>
        </div>
        <p id="question-text" class="question" aria-live="polite"></p>
        <div id="options-container" class="options" role="group" aria-label="보기"></div>
        <div id="feedback-box" class="feedback hidden" role="alert" aria-live="assertive">
          <p id="feedback-msg"></p>
          <p id="source-text" class="source"></p>
        </div>
        <button id="next-btn" class="btn btn-primary hidden">다음 문제 →</button>
      </div>
    </div>

    <!-- 결과 화면 -->
    <div id="screen-result" class="screen hidden" tabindex="-1">
      <div class="card">
        <h2 class="title">결과</h2>
        <div id="score-display" class="score-display"></div>
        <div id="grade-display" class="grade" aria-live="polite"></div>
        <table id="category-table" class="cat-table" aria-label="카테고리별 점수"></table>
        <div id="weak-category" class="weak-cat" role="note"></div>
        <div class="btn-group">
          <button id="to-leaderboard-btn" class="btn btn-primary">순위표 보기</button>
          <button id="retry-btn-result" class="btn btn-secondary">다시하기</button>
        </div>
      </div>
    </div>

    <!-- 순위표 화면 -->
    <div id="screen-leaderboard" class="screen hidden" tabindex="-1">
      <div class="card">
        <div class="lb-header">
          <h2 class="title"><span aria-hidden="true">🏆</span> 순위표</h2>
          <button id="reset-lb-btn" class="btn-reset" aria-label="기록 초기화">초기화</button>
        </div>
        <table id="leaderboard-table" class="leaderboard" aria-label="상위 10명 순위표"></table>
        <button id="retry-btn-lb" class="btn btn-primary">다시하기</button>
      </div>
    </div>

  </div>
  <script src="data/questions.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
